[build]
  command = "pnpm build"
  publish = "dist"
  environment = { NODE_VERSION = "24", PNPM_VERSION = "11.22.0" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Opting your Website out of Google's FLoC Network
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "interest-cohort=()"
